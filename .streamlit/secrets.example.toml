# EJEMPLO SIN SECRETOS — copiar a .streamlit/secrets.toml fuera de Git
# Crear cliente OAuth tipo Web en proyecto Google Cloud exclusivo de pruebas.
# URI autorizada de redirección: http://localhost:8501/oauth2callback
allowed_emails = ["usuario-pruebas@example.com"]

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REEMPLAZAR_POR_SECRETO_ALEATORIO_LARGO"
client_id = "REEMPLAZAR_CLIENT_ID_GOOGLE_PRUEBAS"
client_secret = "REEMPLAZAR_CLIENT_SECRET_GOOGLE_PRUEBAS"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
